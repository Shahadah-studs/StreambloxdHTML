<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMBLOXD NETWORK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        nav { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; background-color: #0b0c10; border-b: 1px solid #1f242e; position: sticky; top: 0; z-index: 50; }
        .nav-title { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        .elite-btn { border: 1px solid #ffffff; background-color: transparent; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s ease; padding: 8px 24px; font-size: 12px; font-weight: bold; cursor: pointer; color: #ffffff; text-decoration: none; }
        .elite-btn:hover { background-color: #ffffff; color: #0b0c10; }
        main { width: 100%; max-width: 1400px; padding: 48px 32px; display: flex; flex-direction: column; align-items: flex-start; flex: 1; }
        .header-section { margin-bottom: 30px; max-width: 640px; border-left: 2px solid #ffffff; padding-left: 16px; }
        .header-section h1 { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; font-size: 30px; margin-bottom: 8px; }
        .header-section p { color: #a1a1aa; font-size: 14px; line-height: 1.6; }
        .pipeline-container { width: 100%; height: 75vh; border: 1px solid #1f242e; background-color: #11141a; display: flex; flex-direction: column; }
        .pipeline-frame { width: 100%; height: 100%; border: none; background-color: #000000; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-title">👑 SHAHADAH STUDIOS ELITE - STREAMBLOXD</div>
        <div class="upload-actions">
            <a href="https://pubnub.com" target="_blank" class="elite-btn">Source Matrix</a>
        </div>
    </nav>
    <main>
        <div class="header-section">
            <h1>Standalone Video Pipeline</h1>
            <p>High-performance, network-driven iframe architectures built with zero local data overhead files.</p>
        </div>
        <div class="pipeline-container">
            <iframe src="https://pubnub.com" class="pipeline-frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>
</body>
</html>
