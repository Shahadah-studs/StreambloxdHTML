<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMBLOXD NETWORK</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        nav { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; background-color: #0b0c10; border-b: 1px solid #1f242e; position: sticky; top: 0; z-index: 50; }
        .nav-title { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        .nav-title span { color: #a1a1aa; }
        .search-container { display: none; }
        @media (min-width: 768px) { .search-container { display: flex; flex: 1; max-width: 500px; margin: 0 32px; } }
        .elite-input { width: 100%; padding: 8px 16px; background-color: #11141a; border: 1px solid #1f242e; color: #ffffff; font-size: 12px; font-family: monospace; }
        .elite-input:focus { border-color: #ffffff; outline: none; }
        .upload-actions { display: flex; align-items: center; gap: 16px; }
        .elite-btn { border: 1px solid #ffffff; background-color: transparent; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s ease; padding: 8px 24px; font-size: 12px; font-weight: bold; cursor: pointer; color: #ffffff; }
        .elite-btn:hover { background-color: #ffffff; color: #0b0c10; }
        #upload-status { width: 100%; display: none; text-align: center; background-color: #18181b; border-bottom: 1px solid #3f3f46; padding: 12px 0; font-size: 12px; font-family: monospace; color: #a1a1aa; }
        main { width: 100%; max-width: 1400px; padding: 48px 32px; display: flex; flex-direction: column; align-items: flex-start; }
        .header-section { margin-bottom: 40px; max-width: 640px; border-left: 2px solid #ffffff; padding-left: 16px; }
        .header-section h1 { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; font-size: 30px; margin-bottom: 8px; }
        .header-section p { color: #a1a1aa; font-size: 14px; line-height: 1.6; }
        #video-grid { width: 100%; display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 640px) { #video-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { #video-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { #video-grid { grid-template-columns: repeat(4, 1fr); } }
        .elite-card { background-color: #11141a; border: 1px solid #1f242e; transition: all 0.2s ease-in-out; display: flex; flex-direction: column; justify-content: space-between; width: 100%; overflow: hidden; }
        .elite-card:hover { border-color: #4f5b73; transform: translateY(-2px); }
        .elite-card video { width: 100%; aspect-ratio: 16/9; background-color: #000000; object-fit: cover; }
        .card-content { padding: 20px; display: flex; flex-direction: column; gap: 4px; }
        .card-content h3 { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; font-size: 14px; color: #f4f4f5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .card-content p { font-size: 12px; color: #a1a1aa; font-family: monospace; margin-top: 4px; }
        .card-content span { font-size: 10px; color: #71717a; font-family: monospace; margin-top: 8px; letter-spacing: 0.05em; }
        .error-message { grid-column: 1 / -1; width: 100%; text-align: left; color: #71717a; font-family: monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; padding: 48px 24px; border: 1px dashed #1f242e; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-title">
            <span>👑</span> SHAHADAH STUDIOS ELITE - StreamBloxd
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search database..." class="elite-input">
        </div>
        <div class="upload-actions">
            <label for="video-input" class="elite-btn">Upload Core</label>
            <input type="file" id="video-input" accept="video/*" style="display: none;">
        </div>
    </nav>
    <div id="upload-status">
        PROCESSING HIGH-PERFORMANCE VIDEO FRAMEWORK... PLEASE WAIT
    </div>
    <main>
        <div class="header-section">
            <h1>Standalone Videos</h1>
            <p>High-performance and low-spec.</p>
        </div>
        <div id="video-grid"></div>
    </main>
    <script>
        const CLOUD_NAME = "demo";
        const UPLOAD_PRESET = "geofcjwy";
        const videoGrid = document.getElementById('video-grid');
        const videoInput = document.getElementById('video-input');
        const uploadStatus = document.getElementById('upload-status');
        async function loadPublicVideos() {
            try {
                const response = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/video/list/project_youtube_clone.json`);
                if (!response.ok) throw new Error();
                const data = await response.json();
                videoGrid.innerHTML = "";
                data.resources.forEach(video => {
                    const videoUrl = `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${video.version}/${video.public_id}.${video.format}`;
                    const videoCard = document.createElement('div');
                    videoCard.className = "elite-card";
                    videoCard.innerHTML = `
                        <video src="${videoUrl}" controls></video>
                        <div class="card-content">
                            <h3>ARCHITECTURE_CORE_${video.public_id.substring(0,6).toUpperCase()}</h3>
                            <p>NODE_ID: index-${video.public_id.substring(0,3)}</p>
                            <span>0% NETWORK DRAW</span>
                        </div>
                    `;
                    videoGrid.appendChild(videoCard);
                });
            } catch (err) {
                videoGrid.innerHTML = `<div class="error-message">No active transmissions stored in the local cloud grid pipeline.</div>`;
            }
        }
        videoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            uploadStatus.style.display = 'block';
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('tags', 'project_youtube_clone');
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://cloudinary.com{CLOUD_NAME}/video/upload`, true);
            xhr.onload = function() {
                uploadStatus.style.display = 'none';
                videoInput.value = "";
                if (xhr.status === 200) {
                    loadPublicVideos();
                } else {
                    alert("Upload architecture payload dropped.");
                }
            };
            xhr.onerror = function() {
                uploadStatus.style.display = 'none';
                videoInput.value = "";
                alert("Network structure fault.");
            };
            xhr.send(formData);
        });
        loadPublicVideos();
        setInterval(loadPublicVideos, 15000);
    </script>
</body>
</html>
